name: matrix_ai_game_companion
description: Android-first AI game companion with screen analysis, translation, voice guidance, recording, and a floating HUD.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_overlay_window: ^0.5.0
  flutter_screen_recording: ^2.0.25
  flutter_tts: ^4.2.5
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.6.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true